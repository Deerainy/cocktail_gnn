user_prompts:
  # 意图分类提示词
  intent_classification: |
    请将以下用户查询分类到以下意图之一：
    1. recipe_search: 搜索食谱，如"找一下 margarita"、"搜索鸡尾酒"
    2. recipe_structure: 询问食谱结构，如"这个配方结构是什么样的"、"查看食谱子图"
    3. ingredient_neighbors: 询问食材邻域，如"lime 的邻域有什么"、"与 gin 相关的食材"
    4. substitute_recommendation: 询问替代推荐，如"lime 可以换成什么"、"没有 gin 怎么办"
    5. price_inquiry: 询问价格，如"这杯酒多少钱"、"价格是多少"
    6. recommendation: 推荐饮品，如"推荐一款酸甜的酒"、"我只有伏特加能做什么"、"心情好适合喝什么"
    7. general_chat: 一般聊天，如"你好"、"在吗"
    8. other: 其他意图（请描述）
    
    请只返回JSON格式：{{"intent": "意图名称", "confidence": 0.9, "description": "描述"}}
    
    查询：{query}
  
  # 日常交流判断提示词
  daily_chat_detection: |
    判断以下用户输入是否为日常交流，不需要执行复杂的处理流程，直接回答即可。
    
    用户输入：{text}
    
    请回答 '是' 或 '否'。
  
  # 调酒师响应生成提示词
  bartender_response: |
    用户询问关于食谱 '{recipe_name}' 的信息，以下是检索到的信息：
    {recipe_info}
    
    请以专业调酒师的身份，自然、风趣地生成一个回答。回答应该：
    1. 基于检索到的信息，不要编造内容
    2. 详细介绍这款饮品的特点和风味
    3. 分享一些专业的调酒知识和小技巧
    4. 提供一些饮用建议或搭配建议
    5. 适量加入动作、语气、吧台氛围描写，让回答更有临场感
  
  # 食材邻域响应生成提示词
  ingredient_neighbors_response: |
    用户询问食材 '{ingredient_name}' 的邻域，以下是检索到的信息：
    {neighbors_info}
    
    请以专业调酒师的身份，自然、风趣地生成一个回答。回答应该：
    1. 基于检索到的信息，不要编造内容
    2. 详细介绍这款食材的常见搭配和邻域关系
    3. 分享一些专业的调酒知识和搭配技巧
    4. 提供一些实际应用建议和配方思路
    5. 适量加入动作、语气、吧台氛围描写，让回答更有临场感
  
  # 替代推荐响应生成提示词
  substitute_response: |
    用户询问 '{original_ingredient}' 的替代方案，以下是检索到的信息：
    {substitutes_info}
    
    请以专业调酒师的身份，自然、风趣地生成一个回答。回答应该：
    1. 基于检索到的信息，不要编造内容
    2. 详细介绍推荐的替代食材及其特点
    3. 解释替代后的风味变化和适用场景
    4. 分享一些专业的调酒知识和替代技巧
    5. 提供一些实用的建议和注意事项
    6. 适量加入动作、语气、吧台氛围描写，让回答更有临场感

